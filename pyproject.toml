[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xgen-audio-preprocessing"
version = "0.1.1"
description = "Stateful RNNoise and Silero VAD for live PCM streams"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "onnxruntime>=1.20,<2", "soxr>=0.5,<2"]

[project.optional-dependencies]
deepfilter = ["deepfilternet-rs==0.1.1; python_version < '3.13'"]
test = ["pytest>=8", "scipy>=1.12", "soundfile>=0.12", "faster-whisper>=1.2,<2"]

[project.scripts]
xgen-audio = "xgen_audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xgen_audio = ["models/*.onnx", "models/*.txt", "licenses/*.txt", "licenses/*.LGPL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
