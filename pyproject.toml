[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xgen-audio-preprocessing"
version = "0.1.2"
description = "Stateful RNNoise and Silero VAD for live PCM streams"
license = {text = "Apache-2.0"}
authors = [{ name = "PlateerLab" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "onnxruntime>=1.20,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.12", "soundfile>=0.12"]
asr-eval = ["faster-whisper>=1.2,<2"]

[project.scripts]
xgen-audio = "xgen_audio.cli:main"

[tool.setuptools]
license-files = ["LICENSE*", "NOTICE*", "THIRD_PARTY_NOTICES*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xgen_audio = ["models/*.onnx", "models/*.txt", "licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
